<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Адвент-календарь — День 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1a2a4f 0%, #0c1222 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      color: #fff;
      position: relative;
    }
    .snowflake {
      position: fixed;
      top: -10px;
      color: #fff;
      opacity: 0.8;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
    }
    .card-scene {
      width: 100%;
      max-width: 360px;
      height: 610px;
      perspective: 1200px;
      position: relative;
      z-index: 2;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .card.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .card-front {
      background: linear-gradient(155deg, #1f3563 0%, #101c38 60%, #0b1326 100%);
      border: 2px solid rgba(247, 208, 112, 0.35);
      text-align: center;
    }
    .header-badge {
      display: inline-block;
      align-self: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: #f7d070;
      background: rgba(247, 208, 112, 0.12);
      border: 1px solid rgba(247, 208, 112, 0.35);
      padding: 6px 14px;
      border-radius: 20px;
    }
    .day-circle {
      width: 116px;
      height: 116px;
      margin: 18px auto 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #f7d070 0%, #d49a24 70%, #9a6d10 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(247, 208, 112, 0.45);
      border: 3px solid #fff3c4;
    }
    .day-num {
      font-size: 64px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      line-height: 1;
    }
    .front-greeting {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .front-sub {
      font-size: 13px;
      color: #b9c7df;
      line-height: 1.45;
      padding: 0 8px;
    }
    .ornament-pattern {
      margin: 12px 0 14px;
      font-size: 15px;
      color: #f7d070;
      letter-spacing: 4px;
      opacity: 0.9;
    }
    .card-back {
      background: linear-gradient(155deg, #1e2f52 0%, #111a30 100%);
      border: 2px solid rgba(247, 208, 112, 0.35);
      transform: rotateY(180deg);
      overflow: hidden;
    }
    .photo-frame {
      width: 100%;
      height: 205px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(247, 208, 112, 0.45);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      background: #090e1a;
      flex-shrink: 0;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    .back-content {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 12px 14px;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .story-title {
      color: #f7d070;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .story-text {
      font-size: 13px;
      line-height: 1.45;
      color: #eaf1fa;
      user-select: text;
    }
    .recipe-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #f39c12, #d35400);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: 0 4px 14px rgba(211, 84, 0, 0.4);
      transition: transform 0.15s, opacity 0.15s;
    }
    .recipe-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .flip-btn-wrapper {
      width: 100%;
    }
    .trigger-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s, filter 0.15s;
    }
    .open-tab {
      background: linear-gradient(135deg, #f7d070 0%, #e0a324 100%);
      color: #1a2238;
    }
    .open-tab:active {
      transform: scale(0.98);
      filter: brightness(0.95);
    }
    .close-tab {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .close-tab:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

    const card = document.getElementById('adventCard');
    const openBtn = document.getElementById('openBtn');

    openBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      card.classList.add('is-flipped');

    closeBtn.addEventListener('click', (e) => {

      el.style.animationDuration = (Math.random() * 3 + 3.5) + 's';
